# Build the plugin on every push; on a version tag (v*), attach an
# installable zip to a GitHub release.  The zip unpacks to a single
# "Deckygram/" folder, which is exactly what Decky Loader expects when
# installing from a URL or from a local file.

name: build

# The release step creates a GitHub release, which needs write access;
# the default GITHUB_TOKEN is read-only unless declared here.
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Sanity-check Python
        run: |
          python3 -m py_compile main.py py_modules/deckygram/*.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .

      - name: Assemble plugin folder
        run: |
          # Zip filename carries the version (tag) or the short SHA, but the
          # folder inside stays plain "Deckygram/" - that's what Decky expects.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="$(git rev-parse --short HEAD)"
          fi
          echo "ZIP_NAME=Deckygram-${VER}.zip" >> "$GITHUB_ENV"
          mkdir -p out/Deckygram
          cp -r dist py_modules main.py plugin.json package.json README.md LICENSE out/Deckygram/
          find out -name __pycache__ -type d -exec rm -rf {} +
          cd out && zip -r "../Deckygram-${VER}.zip" Deckygram

      - uses: actions/upload-artifact@v4
        with:
          name: Deckygram
          path: Deckygram-*.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two assets per release:
          #   Deckygram-vX.Y.Z.zip  - versioned, for humans and archives
          #   Deckygram.zip         - constant name, so the STABLE url
          #     releases/latest/download/Deckygram.zip always works for
          #     Decky's "Install plugin from URL".
          cp "${ZIP_NAME}" Deckygram.zip

          # Release notes come from CHANGELOG.md - the section for this
          # tag, up to the next "## v". Writing them by hand meant three
          # releases went out with nothing but an auto-generated "Full
          # Changelog" link while the notes sat in the repo unread.
          awk -v want="## ${GITHUB_REF_NAME}" '
            $0 == want { found = 1; next }
            /^## v/     { if (found) exit }
            found       { print }
          ' CHANGELOG.md > notes.md
          if [ "$(wc -c < notes.md)" -lt 50 ]; then
            echo "No CHANGELOG section for ${GITHUB_REF_NAME}; generating notes."
            NOTES_ARG="--generate-notes"
          else
            NOTES_ARG="--notes-file notes.md"
          fi

          # Idempotent: re-pushing an existing tag (e.g. after a history
          # rewrite) refreshes the assets instead of failing on "already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ZIP_NAME}" Deckygram.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ZIP_NAME}" Deckygram.zip \
              --title "Deckygram ${GITHUB_REF_NAME}" ${NOTES_ARG}
          fi
